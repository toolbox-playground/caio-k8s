# ============================================================
# MinIO — StatefulSet + Services + Buckets
# ============================================================
# Substitui o chart bitnami/minio (descontinuado).
# Deploy direto via manifest — sem dependência de Helm chart externo.
#
# Componentes:
#   - Secret: credenciais de acesso (rootUser / rootPassword)
#   - StatefulSet: MinIO server (API :9000 + Console :9001)
#   - Service (ClusterIP): acesso interno do Mimir
#   - Service (NodePort 39001): console web acessível em localhost:9001
#   - Job: cria os 3 buckets necessários via mc (MinIO client)
#
# Aplicar:
#   kubectl apply -f 00-minio.yaml
#
# Verificar:
#   kubectl rollout status statefulset/minio -n monitoring
#   kubectl get pods -n monitoring -l app=minio
# ============================================================

---
# Credenciais do MinIO.
# Em produção: use um Secret gerenciado externamente (Vault, SOPS, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: monitoring
type: Opaque
stringData:
  rootUser: mimir
  rootPassword: mimir-supersecret

---
# StatefulSet garante identidade estável (minio-0) e PVC para os dados.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: monitoring
  labels:
    app: minio
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  serviceName: minio

  template:
    metadata:
      labels:
        app: minio
        app.kubernetes.io/name: minio
    spec:
      containers:
        - name: minio
          # Imagem oficial do MinIO — atualizar a tag conforme necessário.
          # Verifique tags disponíveis: https://hub.docker.com/r/minio/minio/tags
          image: minio/minio:RELEASE.2024-11-07T00-52-20Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootPassword
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

---
# ClusterIP — acesso interno do Mimir ao MinIO (porta 9000).
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: monitoring
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
  type: ClusterIP

---
# NodePort — console web do MinIO acessível em http://localhost:9001
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  namespace: monitoring
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 39001  # requer service-node-port-range: 30000-40000 no cluster-config.yaml
  type: NodePort

---
# Job que cria os 3 buckets necessários pelo Mimir.
# Aguarda o MinIO estar ready antes de tentar criar os buckets.
# O Job é idempotente: pode ser reaplicado sem problemas (buckets já existentes são ignorados).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
  namespace: monitoring
  labels:
    app: minio
spec:
  # backoffLimit alto para aguardar o MinIO subir em ambientes lentos.
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: minio
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Aguarda o MinIO estar ready antes de tentar criar os buckets.
        - name: wait-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://minio.monitoring.svc.cluster.local:9000/minio/health/ready; do
                echo "Aguardando MinIO..."
                sleep 3
              done
      containers:
        - name: mc
          # MinIO client oficial para criação de buckets.
          image: minio/mc:RELEASE.2024-11-05T11-29-45Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootPassword
          command:
            - sh
            - -c
            - |
              mc alias set local http://minio.monitoring.svc.cluster.local:9000 \
                $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD

              # Cria os 3 buckets necessários pelo Mimir.
              # mb --ignore-existing: não falha se o bucket já existe.
              mc mb --ignore-existing local/mimir-blocks
              mc mb --ignore-existing local/mimir-alertmanager
              mc mb --ignore-existing local/mimir-ruler

              echo "Buckets criados: mimir-blocks, mimir-alertmanager, mimir-ruler"
              mc ls local/
