# ============================================================
# AIStor — Credenciais + Job de criação de buckets
# ============================================================
# O AIStor Server é provisionado via Helm chart (não mais via
# manifest direto). Este arquivo contém apenas os recursos que
# precisam existir antes ou depois do Helm chart:
#
#   1. Secret "aistor-storage-config"
#      Credenciais lidas pelo AIStor Operator para configurar
#      MINIO_ROOT_USER e MINIO_ROOT_PASSWORD no ObjectStore.
#      Também usadas pelo Job de criação de buckets.
#
#   2. Job "aistor-create-buckets"
#      Cria os 3 buckets do Mimir após o AIStor subir.
#      Idempotente — pode ser reaplicado sem problemas.
#
# Fluxo de instalação (ver QUICK-START.md):
#   1. kubectl apply -f manifests/00-minio.yaml  ← este arquivo
#   2. helm upgrade --install minio minio/aistor-objectstore \
#        --namespace monitoring \
#        -f install/values-aistor-objectstore.yaml
#   3. kubectl wait --for=condition=complete job/aistor-create-buckets ...
#
# Endpoint S3 (para o Mimir):
#   http://minio.monitoring.svc.cluster.local:80
#   (porta 80 = HTTP, TLS desabilitado via disableAutoCert: true)
# ============================================================

---
# Credenciais do AIStor ObjectStore.
# Formato config.env: variáveis de ambiente no estilo shell export.
# O Operator lê a chave "config.env" deste Secret para configurar
# MINIO_ROOT_USER e MINIO_ROOT_PASSWORD no container do AIStor.
#
# O Secret também contém as chaves "rootUser" / "rootPassword" para
# uso pelo Job de criação de buckets (env vars simples).
#
# Em produção: use External Secrets Operator + Vault/AWS SSM.
apiVersion: v1
kind: Secret
metadata:
  name: aistor-storage-config
  namespace: monitoring
type: Opaque
stringData:
  # Formato lido pelo AIStor Operator (config.env)
  config.env: |
    export MINIO_ROOT_USER="mimir"
    export MINIO_ROOT_PASSWORD="mimir-supersecret"
  # Formato usado pelo Job de criação de buckets (env vars individuais)
  rootUser: mimir
  rootPassword: mimir-supersecret

---
# Job que cria os 3 buckets necessários pelo Mimir via MinIO Client (mc).
# O initContainer aguarda o AIStor estar healthy antes de criar os buckets.
# backoffLimit alto para tolerar clusters lentos no Kind.
apiVersion: batch/v1
kind: Job
metadata:
  name: aistor-create-buckets
  namespace: monitoring
  labels:
    app: aistor-mimir
  annotations:
    # Garante que o Job rode depois do ObjectStore estar Ready
    # (usado pelo ArgoCD sync wave no módulo 07)
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: aistor-mimir
    spec:
      restartPolicy: OnFailure

      initContainers:
        # Aguarda a API S3 do AIStor estar healthy.
        # Com disableAutoCert: true, o endpoint é HTTP na porta 80.
        - name: wait-aistor
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Aguardando AIStor S3 API (http://minio.monitoring.svc.cluster.local/minio/health/ready)..."
              until wget -q --spider http://minio.monitoring.svc.cluster.local/minio/health/ready; do
                echo "  ainda não está pronto — aguardando 3s..."
                sleep 3
              done
              echo "AIStor ready!"

      containers:
        - name: mc
          # MinIO Client — mesma imagem usada com MinIO standalone.
          # A API S3 do AIStor é 100% compatível com mc.
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: aistor-storage-config
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aistor-storage-config
                  key: rootPassword
          command:
            - sh
            - -c
            - |
              # Configura alias apontando para o AIStor (porta 80, HTTP)
              mc alias set local http://minio.monitoring.svc.cluster.local \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"

              # Cria os 3 buckets do Mimir.
              # --ignore-existing: não falha se o bucket já existe (idempotente).
              mc mb --ignore-existing local/mimir-blocks
              mc mb --ignore-existing local/mimir-alertmanager
              mc mb --ignore-existing local/mimir-ruler

              echo "Buckets criados: mimir-blocks, mimir-alertmanager, mimir-ruler"
              mc ls local/

