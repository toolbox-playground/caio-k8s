# values-minio.yaml
# MinIO em modo standalone para uso local com Mimir.
#
# Função: object storage S3-compatível que o Mimir usa para
# armazenar blocos de métricas de longo prazo.
#
# Em produção: substitua por AWS S3, Google Cloud Storage ou Azure Blob.
# A única mudança seria no mimir-config.yaml (endpoint + credenciais).
#
# Chart: bitnami/minio
# Instalar: helm upgrade --install minio bitnami/minio \
#             --namespace monitoring \
#             -f helm-values/values-minio.yaml

# Modo de operação: standalone = nó único, disco único.
# Suficiente para Kind. Em produção: distributed (4+ nós, erasure coding).
mode: standalone

# Credenciais de acesso ao MinIO.
# São usadas pelo Mimir (no mimir-config.yaml) para autenticar.
# Em produção: use Kubernetes Secrets ou integração com Vault.
auth:
  rootUser: mimir
  rootPassword: mimir-supersecret

# Criação automática de buckets ao iniciar o MinIO.
# O Mimir precisa que os três buckets já existam antes de iniciar.
provisioning:
  enabled: true
  buckets:
    # Armazena os blocos de métricas compactados (formato Prometheus TSDB).
    # É o bucket principal — contém a maior parte dos dados.
    - name: mimir-blocks
    # Armazena regras do Alertmanager (silences, configs).
    - name: mimir-alertmanager
    # Armazena regras de gravação e alertas gerenciados pelo Mimir.
    - name: mimir-ruler

# Persistência via PVC para o MinIO guardar os dados entre restarts.
# Esta é a peça central do módulo: os dados sobrevivem ao restart do Prometheus
# porque estão aqui, não no Prometheus.
persistence:
  enabled: true
  size: 5Gi

# O MinIO não precisa de NodePort para uso interno pelo Mimir —
# a comunicação é toda dentro do cluster via ClusterIP.
# O console (porta 9001) é exposto via NodePort para acesso visual.
service:
  type: ClusterIP

# Console web do MinIO — exposto via NodePort 39001 (hostPort 9001).
# Permite visualizar os buckets e verificar os blocos que o Mimir gravou.
# Login: mimir / mimir-supersecret
consoleService:
  type: NodePort
  nodePorts:
    console: "39001"
