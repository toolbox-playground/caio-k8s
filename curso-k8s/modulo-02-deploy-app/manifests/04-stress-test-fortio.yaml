apiVersion: v1
kind: Pod
metadata:
  name: fortio-stress-test
  namespace: games
  labels:
    app: stress-test
    tool: fortio
spec:
  containers:
  - name: fortio
    image: fortio/fortio:latest
    args:
    - load
    - -c
    - "50"        # 50 conexões concorrentes
    - -qps
    - "0"         # QPS ilimitado (máxima carga)
    - -t
    - "10m"       # Durar 10 minutos
    - -loglevel
    - "Warning"   # Menos verboso
    - http://super-mario-service.games.svc.cluster.local:8080/
  restartPolicy: Never
  # Timeout de 15 minutos (margem de segurança)
  activeDeadlineSeconds: 900
---
apiVersion: v1
kind: Pod
metadata:
  name: fortio-interactive
  namespace: games
  labels:
    app: monitoring
    tool: fortio
spec:
  containers:
  - name: fortio
    image: fortio/fortio:latest
    command:
    - /bin/sh
    - -c
    - |
      echo "🔍 Fortio Interactive Pod"
      echo "Use 'kubectl exec -it fortio-interactive -n games -- /bin/sh' para acessar"
      echo ""
      echo "Comandos úteis:"
      echo "  fortio load -c 10 -n 100 http://super-mario-service:8080/"
      echo "  fortio load -c 50 -qps 0 -t 30s http://super-mario-service:8080/"
      echo "  fortio curl http://super-mario-service:8080/"
      echo ""
      
      # Manter pod rodando
      tail -f /dev/null
  restartPolicy: Always
