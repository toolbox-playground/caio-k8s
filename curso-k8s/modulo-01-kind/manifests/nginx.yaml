# ========================================
# Deployment: nginx
# ========================================
# Gerencia a criação e atualização de pods nginx
# com controle de réplicas e estratégia de deploy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: default
  labels:
    app: nginx
    version: "1.27"
    tier: frontend
spec:
  # Número de réplicas do pod
  replicas: 2
  
  # Seletor que identifica quais pods este deployment gerencia
  selector:
    matchLabels:
      app: nginx
  
  # Estratégia de atualização
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Quantos pods extras durante update
      maxUnavailable: 0  # Garante zero downtime
  
  # Template do pod
  template:
    metadata:
      labels:
        app: nginx
        version: "1.27"
        tier: frontend
    spec:
      containers:
      - name: nginx
        # Usando versão específica (boa prática)
        image: nginx:1.27
        imagePullPolicy: IfNotPresent  # Usa imagem local se disponível
        
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Recursos (importante para produção)
        resources:
          requests:
            cpu: 100m      # 0.1 CPU
            memory: 128Mi
          limits:
            cpu: 200m      # 0.2 CPU
            memory: 256Mi

---
# ========================================
# Service: nginx-nodeport (NodePort)
# ========================================
# Expõe o nginx em uma porta específica do node
# Útil para acesso externo em desenvolvimento
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: default
  labels:
    app: nginx
    tier: frontend
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30000  # Porta acessível externamente (30000-32767)