# ============================================================
# AIStor — Credenciais + Job de criação de buckets
# ============================================================
# Gerenciado pelo ArgoCD via apps/06-minio-app.yaml (source 3).
#
# Este arquivo contém os recursos Kubernetes que acompanham o
# Helm chart do AIStor ObjectStore:
#
#   1. Secret "aistor-storage-config"
#      Referenciado pelo Helm chart via objectStore.configuration.name.
#      Deve existir ANTES do chart sincronizar (sync-wave: -2).
#
#   2. Job "aistor-create-buckets"
#      Cria os 3 buckets do Mimir após o AIStor estar Ready.
#      Hook PostSync: executa depois que o ObjectStore estiver Healthy.
#
# ── Endpoint S3 (para o Mimir) ─────────────────────────────────────────────
#   http://minio.monitoring.svc.cluster.local:80
#   (AIStor com disableAutoCert: true expõe HTTP na porta 80)
# ============================================================

---
# Credenciais do AIStor ObjectStore.
# O Operator lê "config.env" deste Secret para configurar o container AIStor.
# O Job de buckets usa "rootUser" / "rootPassword" como env vars individuais.
#
# sync-wave: -2 garante que o Secret exista antes do chart (wave -1).
#
# Em produção: use External Secrets Operator + Vault/AWS SSM.
apiVersion: v1
kind: Secret
metadata:
  name: aistor-storage-config
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  # Formato config.env: lido pelo AIStor Operator
  config.env: |
    export MINIO_ROOT_USER="mimir"
    export MINIO_ROOT_PASSWORD="mimir-supersecret"
  # Chaves individuais: usadas pelo Job de criação de buckets
  rootUser: mimir
  rootPassword: mimir-supersecret

---
# Job que cria os 3 buckets do Mimir após o AIStor estar Ready.
# Hook PostSync: o ArgoCD executa este Job depois que o sync completa
# e o ObjectStore está Healthy.
# BeforeHookCreation: recria o Job em cada novo sync (idempotente).
apiVersion: batch/v1
kind: Job
metadata:
  name: aistor-create-buckets
  namespace: monitoring
  labels:
    app: aistor-mimir
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: aistor-mimir
    spec:
      restartPolicy: OnFailure

      initContainers:
        # Aguarda o AIStor S3 API estar healthy.
        # Com disableAutoCert: true → HTTP na porta 80 (sem porta explícita = 80).
        - name: wait-aistor
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Aguardando AIStor S3 API..."
              until wget -q --spider http://minio.monitoring.svc.cluster.local/minio/health/ready; do
                echo "  ainda não está pronto — aguardando 3s..."
                sleep 3
              done
              echo "AIStor ready!"

      containers:
        - name: mc
          # MinIO Client — API S3 do AIStor é 100% compatível com mc.
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: aistor-storage-config
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aistor-storage-config
                  key: rootPassword
          command:
            - sh
            - -c
            - |
              # Configura alias: AIStor com TLS desabilitado usa porta 80 (HTTP).
              mc alias set local http://minio.monitoring.svc.cluster.local \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"

              # Cria os 3 buckets necessários pelo Mimir.
              # --ignore-existing: idempotente (não falha se já existem).
              mc mb --ignore-existing local/mimir-blocks
              mc mb --ignore-existing local/mimir-alertmanager
              mc mb --ignore-existing local/mimir-ruler

              echo "Buckets criados: mimir-blocks, mimir-alertmanager, mimir-ruler"
              mc ls local/
