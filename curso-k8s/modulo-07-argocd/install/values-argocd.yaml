# values-argocd.yaml
# Helm values do Argo CD para o cluster Kind local.
#
# Chart : argo/argo-cd  (https://argoproj.github.io/argo-helm)
# Versão: >= 8.0.0  →  ArgoCD v3.x
#
# Verificar versões disponíveis:
#   helm search repo argo/argo-cd --versions | head -10
#
# Instalar / atualizar:
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm repo update
#
#   # Linux / macOS
#   helm upgrade --install argocd argo/argo-cd \
#     --namespace argocd --create-namespace \
#     --version ">=8.0.0" \
#     -f install/values-argocd.yaml \
#     --wait --timeout 5m
#
#   # Windows (PowerShell)
#   helm upgrade --install argocd argo/argo-cd `
#     --namespace argocd --create-namespace `
#     --version ">=8.0.0" `
#     -f install/values-argocd.yaml `
#     --wait --timeout 5m
#
# ── Novidades v3 refletidas neste arquivo ────────────────────────────────
#   - ServerSideApply é o padrão (Client-Side Apply Migration ativo)
#   - application.resourceTrackingMethod: annotation  (tracking por label foi
#     depreciado para garantir rastreamento preciso de resources renomeados)
#   - global.env: para ENV vars aplicadas a todos os componentes
#   - applicationSet.metrics: habilitado para o Prometheus scrape
# ─────────────────────────────────────────────────────────────────────────

# ── Configurações globais ────────────────────────────────────────────────
global:
  # Em produção: pin para o tag exato do ArgoCD (ex: "v3.0.3")
  # image:
  #   tag: "v3.0.3"
  env: []   # ENV vars injetadas em todos os Deployments do ArgoCD

# ── Configurações globais do servidor ArgoCD ────────────────────────────────
configs:
  params:
    # Desabilita TLS no servidor — usa HTTP puro.
    # APENAS para ambiente local/Kind. Em produção: remova esta linha e
    # configure certificados TLS via cert-manager ou ingress com TLS.
    server.insecure: "true"

  # Configurações do ArgoCD (argocd-cm)
  cm:
    # ── Rastreamento por annotation (padrão recomendado no v3) ──────────
    # Garante rastreamento correto de resources mesmo quando renomeados.
    # O método "label" foi depreciado no v3.
    application.resourceTrackingMethod: annotation

    # ── Server-Side Apply Migration (padrão no v3) ───────────────────────
    # O ArgoCD v3 usa SSA por padrão. O campo abaixo garante que resources
    # criados com client-side apply sejam migrados automaticamente para SSA
    # no próximo sync. Desabilite apenas se tiver conflitos com outros operators.
    # Documentado em: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/
    # (não é um campo do argocd-cm — é syncOption por Application, já configurado nos YAMLs)

  # ── RBAC (argocd-rbac-cm) ─────────────────────────────────────────────
  rbac:
    # Política padrão para usuários sem role explícita.
    # "role:readonly" permite ver mas não sincronizar — seguro para testes.
    # Em produção com SSO: considere "" (sem acesso) como padrão.
    policy.default: role:readonly

    # ── v3: RBAC com Dex usa federated_claims.user_id (não mais "sub") ──
    # Se usar SSO no futuro, as policies devem referenciar o email legível:
    #   g, usuario@empresa.com, role:admin
    # e NÃO o hash base64 do claim "sub".


# ── ArgoCD Server (UI + API) ──────────────────────────────────────────────
server:
  service:
    type: NodePort
    # nodePortHttp: deve corresponder ao containerPort do Kind (30080).
    # hostPort 8080 no kind → NodePort 30080 no cluster
    nodePortHttp: 30080
    # nodePortHttps: 443 path — não necessário no modo insecure
    nodePortHttps: 30443

  # Recursos mínimos para o Kind — suficiente para ≤20 Applications.
  # Em produção: aumente conforme o número de apps e frequência de sync.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── Application Set Controller ───────────────────────────────────────────
applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Notifications Controller ─────────────────────────────────────────────
notifications:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Dex (SSO) ─────────────────────────────────────────────────────────────
# Dex provê integração com provedores OAuth (GitHub, GitLab, OIDC, etc.).
# Desativado por padrão — usamos login admin/password neste módulo.
# Em produção: configure com seu provedor SSO.
dex:
  enabled: false

# ── Redis ─────────────────────────────────────────────────────────────────
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Repo Server (clona e processa manifests do git) ──────────────────────
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
