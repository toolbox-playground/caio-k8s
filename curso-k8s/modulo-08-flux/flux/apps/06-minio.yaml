# ============================================================
# HelmRelease — AIStor ObjectStore (MinIO enterprise)
# ============================================================
# Equivalente ao ArgoCD Application "minio" (06-minio-app.yaml).
#
# No ArgoCD: sync-wave: "-1" → sobe antes do Mimir.
# No Flux: o Mimir tem dependsOn: [minio] → mesmo efeito, por nome.
#
# Pré-requisito (fora do Flux — aplicar manualmente):
#   helm upgrade --install aistor-operator minio/aistor \
#     --namespace aistor --create-namespace --wait
#
# O chart aistor-objectstore cria o CRD ObjectStore que o
# AIStor Operator converte em pods de storage S3-compatível.
# ============================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: flux-system
  labels:
    module: "08"
    tier: storage
spec:
  interval: 10m
  dependsOn:
    - name: namespaces

  chart:
    spec:
      chart: aistor-objectstore
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: minio
        namespace: flux-system
      interval: 1h

  targetNamespace: monitoring
  releaseName: minio

  install:
    createNamespace: true
    # Retry se o AIStor Operator ainda não estiver instalado
    remediation:
      retries: 5

  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true

  valuesFrom:
    - kind: ConfigMap
      name: minio-values
      valuesKey: values-aistor-objectstore.yaml
