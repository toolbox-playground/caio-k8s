# ============================================================
# Kustomization — profiler-manifests
# ============================================================
# Equivalente ao ArgoCD Application "profiler-manifests" (12-profiler-manifests-app.yaml).
# Aplica: Deployment da ranking-api v2 (OTel + Pyroscope SDK), load generator.
#
# No ArgoCD: sync-wave: 2 → sobe depois do OTel/Pyroscope.
# No Flux: dependsOn: [opentelemetry, alloy] → aguarda ambos Ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: profiler-manifests
  namespace: flux-system
  labels:
    module: "08"
    tier: observability
spec:
  interval: 5m
  # Sobe depois do OTel e Alloy para garantir que os coletores estão prontos
  dependsOn:
    - name: opentelemetry
    - name: alloy
  path: ./curso-k8s/modulo-07-argocd/stack/profiler/manifests
  sourceRef:
    kind: GitRepository
    name: caio-k8s
  prune: true
  targetNamespace: monitoring
