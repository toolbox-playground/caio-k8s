# ============================================================
# Kind Cluster: k8s-essentials (Módulo 05 — com Pyroscope)
# ============================================================
# Mesmo cluster-config do pyroscope-sdk — ambas as abordagens
# precisam da porta 4040 para o Pyroscope Server.
# ============================================================

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: k8s-essentials

nodes:
  - role: control-plane
    extraPortMappings:

    # ---- Módulo 02: Super Mario App ----
    - containerPort: 30000
      hostPort: 8081
      protocol: TCP

    # ---- Módulo 03: Prometheus ----
    - containerPort: 30090
      hostPort: 9090
      protocol: TCP

    # ---- Módulo 03: Grafana ----
    # Login padrão: admin / prom-operator
    - containerPort: 31000
      hostPort: 3000
      protocol: TCP

    # ---- Módulo 03: Alertmanager ----
    - containerPort: 32000
      hostPort: 9093
      protocol: TCP

    # ---- Módulo 03: Node Exporter ----
    - containerPort: 32001
      hostPort: 9100
      protocol: TCP

    # ---- Módulo 05: Grafana Pyroscope ----
    # Acesse em: http://localhost:4040
    - containerPort: 34040
      hostPort: 4040
      protocol: TCP

  - role: worker
