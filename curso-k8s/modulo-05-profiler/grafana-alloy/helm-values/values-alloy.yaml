# values-alloy.yaml
# Helm values para o Grafana Alloy como DaemonSet de profiling contínuo.
#
# Referência do chart: grafana/alloy
# Helm repo:  helm repo add grafana https://grafana.github.io/helm-charts
#
# Instalar:
#   helm install alloy grafana/alloy \
#     --namespace monitoring \
#     --create-namespace \
#     -f helm-values/values-alloy.yaml
#
# ⚠️  O componente pyroscope.ebpf requer que o pod do Alloy rode com
#     privileged: true para ter acesso ao kernel via eBPF.
#     Isso é seguro em Kind (dev local) mas requer análise de segurança
#     em produção. Alternativas menos permissivas: capabilities específicas
#     (SYS_ADMIN, SYS_PTRACE, PERFMON) em vez de privileged total.

# ── Controller: DaemonSet (1 pod por nó) ─────────────────────
# O Alloy precisa rodar em cada nó para capturar os processos locais via eBPF.
# Um Deployment normal não funcionaria pois um pod só enxerga o nó onde está.
controller:
  type: daemonset

# ── Security Context: necessário para eBPF ───────────────────
# O eBPF precisa de acesso ao kernel do nó host.
# privileged: true concede todos os capabilities necessários.
#
# Em produção (security hardening), substitua por capabilities específicas:
#   capabilities:
#     add: ["SYS_ADMIN", "SYS_PTRACE", "PERFMON", "BPF"]
#   readOnlyRootFilesystem: false
alloy:
  securityContext:
    privileged: true
    runAsUser: 0

  # ── Configuração principal do Alloy (linguagem River) ─────
  # O conteúdo abaixo é o pipeline de observabilidade do Alloy.
  # Cada bloco é um "componente" com inputs e outputs fortemente tipados.
  #
  # Pipeline:
  #   discovery.kubernetes → discovery.relabel → pyroscope.ebpf → pyroscope.write
  configMap:
    content: |

      // ══════════════════════════════════════════════════════
      // 1. DESCOBERTA DE PODS KUBERNETES
      // ══════════════════════════════════════════════════════
      //
      // discovery.kubernetes descobre recursos do cluster via API do K8s.
      // role = "pod" → lista todos os pods em todos os namespaces.
      //
      // Cada pod vira um "target" com metadados automáticos:
      //   __meta_kubernetes_pod_name           = "ranking-api-abc123"
      //   __meta_kubernetes_namespace          = "games"
      //   __meta_kubernetes_pod_label_app      = "ranking-api"
      //   __meta_kubernetes_pod_node_name      = "k8s-essentials-worker"
      //   __meta_kubernetes_pod_ip             = "10.244.1.5"
      //   __meta_kubernetes_pod_container_name = "ranking-api"
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // ══════════════════════════════════════════════════════
      // 2. RELABELING: TRANSFORMAR METADADOS EM LABELS
      // ══════════════════════════════════════════════════════
      //
      // discovery.relabel transforma os __meta_* em labels limpos.
      // Labels definidos aqui aparecem como filtros no Grafana Pyroscope.
      //
      // Sem relabeling: labels são __meta_kubernetes_pod_label_app (feio)
      // Com relabeling: labels são service_name, namespace, pod (limpo)
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // service_name: label principal para identificar o serviço no Pyroscope.
        // DEVE ser igual ao service.name do OTel para que Trace → Profile funcione.
        // Usa o label "app" do pod (ex: app=ranking-api → service_name=ranking-api).
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "service_name"
        }

        // namespace: identifica em qual namespace o pod está.
        // Útil para filtrar: {namespace="games"} vs {namespace="monitoring"}
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        // pod: nome completo do pod (inclui hash do ReplicaSet).
        // Útil para correlacionar um flame graph com um pod específico.
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        // node: nó onde o pod está rodando.
        // Útil para diagnosticar problemas específicos de um nó.
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      // ══════════════════════════════════════════════════════
      // 3. PROFILING VIA eBPF
      // ══════════════════════════════════════════════════════
      //
      // pyroscope.ebpf usa programas eBPF no kernel para capturar
      // o call stack de todos os processos listados em "targets".
      //
      // Método: CPU sampling via perf_events (perf_event_open syscall)
      //   → a cada ~10ms, o kernel captura o call stack do processo ativo
      //   → o Alloy agrega as amostras em um profile comprimido
      //   → a cada 15s, envia via HTTP para o Pyroscope Server
      //
      // Suporte por linguagem:
      //   ✅ Go         (debug symbols via DWARF)
      //   ✅ Python     (via py-spy integrado no eBPF)
      //   ✅ Java/JVM   (via async-profiler)
      //   ✅ Node.js    (via V8 profiling hooks)
      //   ✅ Rust, C/C++ (binários com debug symbols)
      //   ⚠️  Python sem debug symbols: frames podem aparecer como "unknown"
      pyroscope.ebpf "default" {
        forward_to     = [pyroscope.write.pyroscope_server.receiver]
        targets        = discovery.relabel.pods.output

        // demangle: como desembaralhar nomes de símbolos C++
        // "full" mostra os nomes completos (mais legível)
        demangle       = "full"
      }

      // ══════════════════════════════════════════════════════
      // 4. ENVIAR PROFILES PARA O PYROSCOPE SERVER
      // ══════════════════════════════════════════════════════
      //
      // pyroscope.write recebe profiles do componente eBPF e os envia
      // para o Pyroscope Server via HTTP.
      //
      // O endpoint usa DNS interno do Kubernetes:
      //   http://<service>.<namespace>.svc.cluster.local:<porta>
      pyroscope.write "pyroscope_server" {
        endpoint {
          url = "http://pyroscope.monitoring.svc.cluster.local:4040"
        }
      }

# ── Recursos do DaemonSet (por nó) ───────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# ── Tolerations: garantir que rode no control-plane também ───
# No Kind, o control-plane tem um taint que impede pods normais.
# Esta toleração permite que o DaemonSet rode nele também.
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
