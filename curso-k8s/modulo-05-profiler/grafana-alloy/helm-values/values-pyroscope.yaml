# values-pyroscope.yaml
# Helm values para o Grafana Pyroscope — idêntico ao da abordagem SDK.
# O Pyroscope Server é o mesmo independente de como os profiles chegam.
#
# Referência do chart: grafana/pyroscope
#
# Instalar:
#   helm install pyroscope grafana/pyroscope \
#     --namespace monitoring \
#     --create-namespace \
#     -f helm-values/values-pyroscope.yaml

pyroscope:
  service:
    type: NodePort
    # containerPort 34040 → hostPort 4040 (definido no manifests/cluster-config.yaml)
    # Acesse em: http://localhost:4040
    nodePort: 34040

  extraArgs:
    # Retém profiles por 1 hora em dev (economiza disco no Kind)
    - --storage.tsdb.retention.time=1h

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: false
