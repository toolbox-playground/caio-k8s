# ============================================================
# Deployment: Ranking API v2 — Modo Híbrido (SDK + eBPF)
# ============================================================
# Versão da Ranking API com pyroscope-io SDK.
# O Alloy eBPF rodará em paralelo via DaemonSet, sem mudanças aqui.
#
# Diferenças em relação ao pyroscope-sdk/manifests:
#   - PYROSCOPE_TAGS inclui "profiler=sdk"
#     Isso permite diferenciar no Grafana:
#       {service_name="ranking-api", profiler="sdk"}  → frames Python (SDK)
#       {service_name="ranking-api", profiler="ebpf"} → syscalls do kernel (Alloy)
#
# Aplicar:
#   kubectl apply -f manifests/01-deployment-ranking-api-v2.yaml
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: ranking-api
  namespace: games
  labels:
    app: ranking-api
    module: "05-profiler"
    version: "2.0.0"

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ranking-api

  template:
    metadata:
      labels:
        app: ranking-api
        version: "2.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"

    spec:
      containers:
      - name: ranking-api
        # Build: docker build -t ranking-api:v2-profiler ./app
        # Load:  kind load docker-image ranking-api:v2-profiler --name k8s-essentials
        image: ranking-api:v2-profiler
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        env:
        # ── Variáveis OpenTelemetry (mantidas do Módulo 04) ────
        - name: OTEL_SERVICE_NAME
          value: "ranking-api"

        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.otel.svc.cluster.local:4317"

        - name: DEPLOYMENT_ENV
          value: "kind-dev"

        # ── Variáveis Pyroscope ────────────────────────────────
        - name: PYROSCOPE_SERVER_ADDRESS
          value: "http://pyroscope.monitoring.svc.cluster.local:4040"

        - name: PYROSCOPE_APPLICATION_NAME
          # DEVE ser igual ao OTEL_SERVICE_NAME para Trace → Profile funcionar.
          value: "ranking-api"

        - name: PYROSCOPE_TAGS
          # ── Diferença do modo híbrido ──────────────────────
          # "profiler=sdk" identifica que este profile veio do SDK Python.
          # O Alloy eBPF adiciona "profiler=ebpf" automaticamente via relabeling.
          #
          # No Grafana você diferencia assim:
          #   {service_name="ranking-api", profiler="sdk"}  → frames Python
          #   {service_name="ranking-api", profiler="ebpf"} → syscalls do kernel
          value: "environment=kind-dev,version=2.0.0,profiler=sdk"

        # ── Probes ────────────────────────────────────────────
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20

        # ── Recursos ──────────────────────────────────────────
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
