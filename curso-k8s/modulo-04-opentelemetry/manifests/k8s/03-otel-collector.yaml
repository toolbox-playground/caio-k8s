# ============================================================
# OTel Collector — ConfigMap + Deployment + Service
# ============================================================
# O Collector é o ponto central de coleta de telemetria.
# Recebe traces/métricas/logs das aplicações via OTLP e
# distribui para Tempo, Prometheus e Loki.
#
# Aplicar: kubectl apply -f 03-otel-collector.yaml
# ============================================================

# ── Namespace ────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: otel
  labels:
    module: "04-opentelemetry"

---
# ── ConfigMap: configuração do pipeline do Collector ─────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel

data:
  config.yaml: |

    # ── Receivers: como o Collector recebe dados ─────────────
    receivers:
      otlp:
        protocols:
          grpc:
            # Porta padrão OTLP/gRPC — aplicações enviam aqui
            endpoint: 0.0.0.0:4317
          http:
            # Porta padrão OTLP/HTTP — alternativa ao gRPC
            endpoint: 0.0.0.0:4318

    # ── Processors: transformam os dados antes de exportar ───
    processors:
      # Agrupa dados em lotes para envio eficiente
      batch:
        timeout: 1s
        send_batch_size: 1024

      # Limita uso de memória — evita OOMKill do Collector
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64

      # Adiciona labels de resource nos logs (necessário para Loki)
      resource:
        attributes:
        - action: insert
          key: loki.resource.labels
          value: service.name, deployment.environment, k8s.namespace.name

    # ── Exporters: para onde os dados são enviados ───────────
    exporters:
      # Traces → Grafana Tempo (via OTLP/gRPC interno)
      otlp/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

      # Métricas → Prometheus (Collector expõe endpoint /metrics)
      # O Prometheus faz scrape neste endpoint
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: otelcol
        resource_to_telemetry_conversion:
          enabled: true  # inclui resource attributes como labels Prometheus

      # Logs → Loki (via API HTTP push)
      loki:
        endpoint: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

      # Debug (opcional): loga dados no stdout do Collector
      # Útil para troubleshooting, desabilitar em produção
      debug:
        verbosity: basic

    # ── Service: define os pipelines de dados ────────────────
    service:
      pipelines:
        # Pipeline de traces: OTLP → batch → Tempo
        traces:
          receivers:  [otlp]
          processors: [memory_limiter, batch]
          exporters:  [otlp/tempo]

        # Pipeline de métricas: OTLP → batch → Prometheus
        metrics:
          receivers:  [otlp]
          processors: [memory_limiter, batch]
          exporters:  [prometheus]

        # Pipeline de logs: OTLP → enriquece com labels → Loki
        logs:
          receivers:  [otlp]
          processors: [memory_limiter, resource, batch]
          exporters:  [loki]

      # Métricas internas do próprio Collector
      telemetry:
        metrics:
          address: 0.0.0.0:8888

---
# ── Deployment: o processo do Collector ──────────────────────
apiVersion: apps/v1
kind: Deployment

metadata:
  name: otel-collector
  namespace: otel
  labels:
    app: otel-collector

spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector

  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        # Prometheus scrape automático das métricas do Collector
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
        prometheus.io/path: "/metrics"

    spec:
      containers:
      - name: otel-collector
        # contrib: versão com exportadores extras (Loki, etc.)
        image: otel/opentelemetry-collector-contrib:0.113.0
        imagePullPolicy: IfNotPresent

        args:
        - "--config=/conf/config.yaml"

        ports:
        - name: otlp-grpc
          containerPort: 4317   # recebe dados das aplicações (gRPC)
        - name: otlp-http
          containerPort: 4318   # recebe dados das aplicações (HTTP)
        - name: metrics-app
          containerPort: 8889   # expõe métricas das aplicações para Prometheus
        - name: metrics-self
          containerPort: 8888   # expõe métricas internas do Collector

        volumeMounts:
        - name: config
          mountPath: /conf

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi

        readinessProbe:
          httpGet:
            path: /
            port: 13133  # porta de health check do otelcol
          initialDelaySeconds: 5
          periodSeconds: 10

      volumes:
      - name: config
        configMap:
          name: otel-collector-config

---
# ── Service: expõe o Collector para as aplicações ────────────
apiVersion: v1
kind: Service

metadata:
  name: otel-collector
  namespace: otel
  labels:
    app: otel-collector

spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
  # OTLP gRPC — usado pelas aplicações para enviar telemetria
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
    protocol: TCP

  # OTLP HTTP — alternativa ao gRPC
  - name: otlp-http
    port: 4318
    targetPort: 4318
    protocol: TCP

  # Métricas das aplicações (scrapeadas pelo Prometheus)
  - name: metrics-app
    port: 8889
    targetPort: 8889
    protocol: TCP

  # Métricas internas do Collector
  - name: metrics-self
    port: 8888
    targetPort: 8888
    protocol: TCP
