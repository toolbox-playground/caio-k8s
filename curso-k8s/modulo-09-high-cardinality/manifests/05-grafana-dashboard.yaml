---
# Stack Health — Módulo 08
# Dashboard de saúde do stack de observabilidade com foco em high cardinality.
# Aplicar: kubectl apply -f manifests/05-grafana-dashboard.yaml
# O sidecar do Grafana detecta ConfigMaps com label grafana_dashboard: "1"
# e importa o JSON automaticamente.

apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-stack-health-mod08
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  stack-health-mod08.json: |
    {
      "__inputs": [],
      "__requires": [
        { "type": "grafana", "id": "grafana", "name": "Grafana", "version": "9.0.0" },
        { "type": "datasource", "id": "prometheus", "name": "Prometheus", "version": "1.0.0" }
      ],
      "annotations": { "list": [] },
      "description": "Saúde do stack de observabilidade — High Cardinality & Otimização (Módulo 08)",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "🔴 Prometheus — Cardinalidade",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 500000 },
                  { "color": "orange", "value": 1000000 },
                  { "color": "red", "value": 2000000 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "9.0.0",
          "targets": [
            {
              "expr": "prometheus_tsdb_head_series",
              "legendFormat": "Séries ativas",
              "refId": "A"
            }
          ],
          "title": "Total de Séries Ativas",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "séries/s",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 1 },
          "id": 3,
          "options": {
            "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "prometheus_tsdb_head_series",
              "legendFormat": "Total séries",
              "refId": "A"
            },
            {
              "expr": "rate(prometheus_tsdb_head_series_created_total[5m]) * 300",
              "legendFormat": "Taxa criação (5m)",
              "refId": "B"
            }
          ],
          "title": "Tendência de Cardinalidade",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 3000 },
                  { "color": "red", "value": 8000 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 5 },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            {
              "expr": "sum(scrape_samples_scraped)",
              "legendFormat": "Amostras totais",
              "refId": "A"
            }
          ],
          "title": "Amostras por Scrape (total)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "lineWidth": 1,
                "showPoints": "never"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "id": 5,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "topk(10, scrape_samples_scraped)",
              "legendFormat": "{{ job }}",
              "refId": "A"
            }
          ],
          "title": "Top 10 Jobs por Amostras Coletadas",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "unit": "s"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "id": 6,
          "options": {
            "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "topk(10, scrape_duration_seconds)",
              "legendFormat": "{{ job }}",
              "refId": "A"
            }
          ],
          "title": "Duração de Scrape por Job (Top 10 mais lentos)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "id": 7,
          "title": "🟠 Mimir — Limites de Ingestão",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.6 },
                  { "color": "orange", "value": 0.7 },
                  { "color": "red", "value": 0.85 }
                ]
              },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 18 },
          "id": 8,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "cortex_ingester_memory_series / cortex_ingester_instance_limits{limit=\"max_series\"}",
              "legendFormat": "Uso do limite",
              "refId": "A"
            }
          ],
          "title": "Mimir — % do Limite de Séries",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 18 },
          "id": 9,
          "options": {
            "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "expr": "cortex_ingester_memory_series",
              "legendFormat": "Séries em memória",
              "refId": "A"
            },
            {
              "expr": "cortex_ingester_instance_limits{limit=\"max_series\"}",
              "legendFormat": "Limite configurado",
              "refId": "B"
            }
          ],
          "title": "Mimir — Séries vs. Limite",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 22 },
          "id": 10,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "sum(rate(cortex_ingester_instance_limits_rejections_total[5m]))",
              "legendFormat": "Rejeições/s",
              "refId": "A"
            }
          ],
          "title": "Mimir — Rejeições por Limite (deve ser 0)",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 },
          "id": 11,
          "title": "🔵 Remote Write — Lag Prometheus → Mimir",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 30 },
                  { "color": "orange", "value": 60 },
                  { "color": "red", "value": 120 }
                ]
              },
              "unit": "s"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 27 },
          "id": 12,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "max(prometheus_remote_storage_highest_timestamp_in_seconds - ignoring(remote_name, url) group_right prometheus_remote_storage_queue_highest_sent_timestamp_seconds)",
              "legendFormat": "Lag (s)",
              "refId": "A"
            }
          ],
          "title": "Remote Write Lag",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 27 },
          "id": 13,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "expr": "rate(prometheus_remote_storage_samples_total[5m])",
              "legendFormat": "Amostras enviadas/s",
              "refId": "A"
            },
            {
              "expr": "rate(prometheus_remote_storage_failed_samples_total[5m])",
              "legendFormat": "Falhas/s",
              "refId": "B"
            },
            {
              "expr": "prometheus_remote_storage_shards",
              "legendFormat": "Shards ativos",
              "refId": "C"
            }
          ],
          "title": "Remote Write — Taxa de Envio e Falhas",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 35 },
          "id": 14,
          "title": "🟢 Loki — Streams Ativos",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5000 },
                  { "color": "orange", "value": 8000 },
                  { "color": "red", "value": 10000 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 36 },
          "id": 15,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "sum(loki_ingester_memory_streams)",
              "legendFormat": "Streams ativos",
              "refId": "A"
            }
          ],
          "title": "Loki — Streams em Memória",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 36 },
          "id": 16,
          "options": {
            "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "expr": "sum(loki_ingester_memory_streams)",
              "legendFormat": "Total streams",
              "refId": "A"
            },
            {
              "expr": "rate(loki_ingester_streams_created_total[5m]) * 300",
              "legendFormat": "Taxa criação (5m)",
              "refId": "B"
            }
          ],
          "title": "Loki — Tendência de Streams",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["kubernetes", "observabilidade", "high-cardinality", "modulo-08"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource",
            "label": "Datasource"
          }
        ]
      },
      "time": { "from": "now-3h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Stack Health — Módulo 08",
      "uid": "stack-health-mod08",
      "version": 1
    }
