# values-alertmanager-discord.yaml
# Configura o Alertmanager para enviar alertas ao Discord via URL direta.
# Use este arquivo para ambientes locais e de estudo.
# Para produção, use values-alertmanager-discord-secret.yaml
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url: "COLE_AQUI_A_URL_DO_WEBHOOK"
    templates:
      - "/etc/alertmanager/config/*.tmpl"
