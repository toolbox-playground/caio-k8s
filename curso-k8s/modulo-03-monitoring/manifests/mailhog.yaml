# mailhog.yaml
# Servidor SMTP falso para testar o envio de e-mails do Alertmanager localmente.
#
# O Mailhog aceita qualquer e-mail na porta 1025 (SMTP) e exibe
# numa interface web na porta 8025 — sem precisar de conta real.
#
# Acesse a caixa de entrada em: http://localhost:8025
# (porta mapeada pelo Kind via cluster-config.yaml → hostPort: 8025)
# Se não estiver usando o Kind com hostPort, use port-forward:
#   kubectl port-forward svc/mailhog -n monitoring 8025:8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: monitoring
  labels:
    app: mailhog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
      - name: mailhog
        image: mailhog/mailhog:v1.0.1
        ports:
        - containerPort: 1025  # SMTP — recebe os e-mails do Alertmanager
          name: smtp
        - containerPort: 8025  # HTTP  — interface web da caixa de entrada
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: monitoring
  labels:
    app: mailhog
spec:
  selector:
    app: mailhog
  ports:
  - name: smtp
    port: 1025
    targetPort: 1025
  - name: http
    port: 8025
    targetPort: 8025
    nodePort: 32025          # mapeado para localhost:8025 pelo Kind
  type: NodePort
