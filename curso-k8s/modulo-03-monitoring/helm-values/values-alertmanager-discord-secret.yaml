# values-alertmanager-discord-secret.yaml
# Configura o Alertmanager para enviar alertas ao Discord via Secret Kubernetes.
# A URL do webhook nunca aparece em YAML versionado nem em `helm get values`.
#
# Pré-requisito: criar o Secret antes do helm upgrade
#   kubectl create secret generic alertmanager-discord-webhook \
#     --from-literal=webhook_url="https://discord.com/api/webhooks/SEU_ID/SEU_TOKEN" \
#     -n monitoring

# Corrige o link "Source" nos alertas do Discord.
# Sem isso, o link aponta para o DNS interno do cluster (inacessível fora do Kind).
prometheus:
  prometheusSpec:
    externalUrl: http://localhost:9090

alertmanager:
  alertmanagerSpec:
    externalUrl: http://localhost:9093
    secrets:
      - alertmanager-discord-webhook    # monta em /etc/alertmanager/secrets/

  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/webhook_url
    templates:
      - "/etc/alertmanager/config/*.tmpl"
