# ============================================================
# ClusterSecretStore — ÚNICO ponto que muda entre local e produção.
#
# LOCAL (kind): provider "fake" — valores estáticos, SÓ para o lab.
#   (Estes valores estão no Git de propósito: não são segredos reais.)
# PRODUÇÃO: troque por AWS Secrets Manager / GCP Secret Manager /
#   Azure Key Vault / Vault — exemplos no README, seção "Produção".
#
# As ExternalSecrets dos charts NÃO mudam.
# ============================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: default
spec:
  provider:
    fake:
      data:
        - { key: /webapp/dev/api-key,              value: dev-key-0001 }
        - { key: /webapp/staging/api-key,          value: staging-key-0001 }
        - { key: /webapp/prod/api-key,             value: prod-key-0001 }
        - { key: /platform/grafana/admin-password, value: change-me-in-lab }
