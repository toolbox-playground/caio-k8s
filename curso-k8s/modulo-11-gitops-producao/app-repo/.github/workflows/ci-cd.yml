# ============================================================
# CI/CD do app-repo  →  entrega no gitops-repo (NÃO no cluster)
#
#   push em main
#     ├─ test          pytest
#     ├─ build         build + push GHCR (tag imutável sha-<7>) + Trivy + Cosign
#     └─ deploy-dev    commit em gitops-repo/envs/dev/values.yaml (image.tag)
#                      └─ ArgoCD detecta o commit e concilia o cluster
#
# O pipeline NUNCA tem kubeconfig. Quem toca o cluster é o ArgoCD (pull),
# o CI só escreve no Git (push). Superfície de ataque muito menor.
#
# Configure no app-repo (Settings → Secrets and variables → Actions):
#   vars.GITOPS_REPO            ex.: minha-org/gitops-repo
#   secrets.GITOPS_APP_ID       ID do GitHub App com contents:write + pull-requests:write
#   secrets.GITOPS_APP_PRIVATE_KEY   chave privada (.pem) do GitHub App
# (Alternativa simples p/ estudo: um PAT fine-grained em secrets.GITOPS_TOKEN —
#  troque o passo "app-token" por `token: ${{ secrets.GITOPS_TOKEN }}`.)
# ============================================================
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push no GHCR
      id-token: write      # assinatura keyless (Cosign/OIDC)
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular tag e nome da imagem
        id: meta
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${owner}/webapp" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Scan de vulnerabilidades (falha em HIGH/CRITICAL corrigíveis)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: sigstore/cosign-installer@v3
      - name: Assinar imagem (keyless)
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    # Serializa escritas no gitops-repo para evitar corrida entre merges seguidos
    concurrency:
      group: gitops-write-dev
      cancel-in-progress: false
    steps:
      - name: Nome do gitops-repo (sem o owner)
        id: repo
        run: echo "name=${GITOPS_REPO#*/}" >> "$GITHUB_OUTPUT"
        env:
          GITOPS_REPO: ${{ vars.GITOPS_REPO }}

      - name: Token do GitHub App (escopo: só o gitops-repo)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.name }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      - name: Atualizar image.tag em envs/dev
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: yq -i '.image.tag = strenv(TAG)' envs/dev/values.yaml

      - name: Commit & push (com retry contra corrida)
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SRC_SHA: ${{ github.sha }}
        run: |
          git config user.name  "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          git add envs/dev/values.yaml
          git diff --cached --quiet && { echo "Nada a alterar."; exit 0; }
          git commit -m "chore(dev): deploy webapp ${TAG}" \
                     -m "Origem: ${{ github.server_url }}/${{ github.repository }}/commit/${SRC_SHA}"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::Falha ao publicar no gitops-repo"; exit 1
