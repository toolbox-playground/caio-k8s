# Gateway: o "ouvinte" que recebe tráfego HTTP na porta 80.
# Mora no namespace "kong", junto com o controller/dataplane.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kong-gateway
  namespace: kong
spec:
  gatewayClassName: kong
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # allowedRoutes.from: All permite que HTTPRoutes de QUALQUER namespace
      # se associem a este Gateway. Como neste setup o HTTPRoute do Mario
      # também vive no namespace "kong" (apenas o Service da app está em
      # "games"), "Same" já seria suficiente para o parentRef — mas usamos
      # "All" para deixar o Gateway reutilizável por outras apps/namespaces
      # no futuro sem precisar editar este arquivo de novo.
      allowedRoutes:
        namespaces:
          from: All
