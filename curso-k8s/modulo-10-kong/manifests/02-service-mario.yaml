# Versão da API: v1 para Services (core)
apiVersion: v1

# Tipo de recurso: Service (expõe pods na rede)
kind: Service

# ========== METADADOS ==========
metadata:
  # Nome do service: DNS interno será super-mario-service.games.svc.cluster.local
  name: super-mario-service

  # Namespace: Mesmo namespace do Deployment
  namespace: games

  # Labels: Para organização e seletores
  labels:
    app: super-mario

# ========== ESPECIFICAÇÃO DO SERVICE ==========
spec:
  # Tipo de Service: NodePort. Mantido (não trocado para ClusterIP) porque
  # você optou por fazer o Kong COEXISTIR com o acesso direto já validado
  # no Módulo 02, em vez de substituí-lo. O Kong continua funcionando
  # normalmente: o HTTPRoute resolve o backend pelo "port" do Service
  # (8080), não pelo nodePort — então as duas vias de acesso não conflitam.
  type: NodePort

  # Seletor: Identifica quais pods receberão tráfego
  # Deve corresponder aos labels dos pods do Deployment
  selector:
    app: super-mario

  # Portas expostas pelo service
  ports:
    - port: 8080 # Porta do Service (usada internamente no cluster, inclusive pelo Kong)
      targetPort: 8080 # Porta do container (onde a app escuta)
      nodePort: 30000 # Mantido igual ao cluster-config.yaml (mapeado para host:8081)
      protocol: TCP # Protocolo de rede
      name: http # Nome descritivo da porta

  # Afinidade de sessão: None = distribui requests aleatoriamente
  # Opção: ClientIP = mesmo cliente vai sempre para mesmo pod
  sessionAffinity: None
